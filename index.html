<!DOCTYPE html>
<!-- ============================================================
  双人对战记分牌（手机竖屏适配版）
  布局完全参照原稿线框：
    1. 顶部：标题「记分牌」+ 「下一局」按钮（结束本局，开始下一局）
    2. 总比分（双方胜场数：本局得分高者 +1）
    3. 双方名字输入框 + 中间互换按钮
    4. 当前局数（如：第七局）
    5. 当前比分（两个大比分框 + 中间冒号）
    6. 双方各自的加分系统按钮（+1 ~ +9、+X 自定义加分、-X 自定义减分）
    7. 历史记录：之前每一局的比分，左右两列展示
  后期修改提示：
    - 颜色 / 尺寸集中在下方 CSS「可修改配置区」
    - 默认名字、按钮分值在 JS「初始状态」里改
    - 所有按钮分值都可以直接在 HTML 按钮的 data-score 属性上调整
  ============================================================ -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 手机视口设置：禁止用户缩放，宽度跟随设备 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>记分牌</title>
  <style>
    /* ========== 可修改配置区：颜色 / 基础尺寸，改这里即可整体换肤 ========== */
    :root {
      --bg-color: #000;            /* 页面背景色（原稿为黑色） */
      --line-color: #fff;          /* 线条 / 边框颜色（原稿为白色） */
      --text-color: #fff;          /* 文字颜色 */
      --title-color: #ff9ec7;      /* 标题「记分牌」颜色（粉色） */
      --btn-bg: transparent;       /* 按钮背景色 */
      --btn-active-bg: #ffffff1a;   /* 按钮按下/悬停时的浅色背景 */
      --main-font: 16px;            /* 正文字号基准 */
      --score-font: 76px;          /* 当前比分大字字号 */
      --total-font: 34px;          /* 总比分字号 */
      --gap: 10px;                 /* 模块之间的间距 */
      --radius: 8px;               /* 控件圆角 */
    }

    /* ========== 全局重置 ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* 去掉手机点击按钮的蓝色高亮 */
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: var(--main-font);
      min-height: 100vh;
      /* 页面整体留白，避免贴到手机屏幕边缘 */
      padding: calc(var(--gap) * 1.2);
      max-width: 480px;             /* 手机端最大宽度，平板/桌面居中显示 */
      margin: 0 auto;
    }

    /* ========== 1. 顶部标题栏：标题 + 「下一局」按钮 ========== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--line-color);
      border-radius: var(--radius);
      padding: var(--gap);
      margin-bottom: var(--gap);
    }
    .header .title {
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--title-color);  /* 标题粉色，颜色在配置区 --title-color 改 */
    }
    /* 「下一局」键：这局结束，开始下一局 */
    .ok-btn {
      background: var(--btn-bg);
      color: var(--title-color);
      border: 1px solid var(--line-color);
      border-radius: var(--radius);
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }
    .ok-btn:active { background: var(--btn-active-bg); }

    /* ========== 2. 总比分区（双方胜场数，格式 03:01） ========== */
    .total-score {
      text-align: center;
      font-size: var(--total-font);
      letter-spacing: 4px;
      padding: var(--gap) 0;
      border-bottom: 1px solid var(--line-color);
      margin-bottom: var(--gap);
    }

    /* ========== 3. 名字输入行：左输入框 ⇄ 互换 右输入框 ========== */
    .name-row {
      display: flex;
      align-items: center;
      gap: var(--gap);
      margin-bottom: var(--gap);
    }
    .name-input {
      flex: 1;
      background: var(--btn-bg);
      border: 1px solid var(--line-color);
      border-radius: var(--radius);
      color: var(--text-color);
      font-size: 18px;
      text-align: center;
      padding: 10px 6px;
      min-width: 0;               /* 允许输入框收缩，防止溢出 */
    }
    .name-input::placeholder { color: #888; }
    /* 中间名字互换按钮 */
    .swap-btn {
      background: var(--btn-bg);
      border: 1px solid var(--line-color);
      border-radius: var(--radius);
      color: var(--text-color);
      font-size: 18px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .swap-btn:active { background: var(--btn-active-bg); }

    /* ========== 4. 当前局数标签 ========== */
    .round-label {
      text-align: center;
      font-size: 15px;
      margin-bottom: 6px;
    }

    /* ========== 5. 当前比分区：左大框 : 右大框 ========== */
    .current-score {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--gap);
      margin-bottom: var(--gap);
    }
    .score-box {
      flex: 1;
      border: 1px solid var(--line-color);
      border-radius: var(--radius);
      text-align: center;
      font-size: var(--score-font);
      padding: 12px 0;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .score-colon {
      font-size: var(--score-font);
      padding: 0 2px;
    }

    /* ========== 6. 加分系统：左右两列按钮组 ========== */
    .controls-row {
      display: flex;
      gap: var(--gap);
      margin-bottom: var(--gap);
    }
    .control-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    /* 按钮网格：每行 4 个（+1 +2 +3 +4 / +5 +6 +7 +8 / +9 +X -X） */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .score-btn {
      background: var(--btn-bg);
      border: 1px solid var(--line-color);
      border-radius: var(--radius);
      color: var(--text-color);
      font-size: 16px;
      padding: 12px 0;
      cursor: pointer;
    }
    .score-btn:active { background: var(--btn-active-bg); }
    /* 减分按钮单独标色（需要时可改） */
    .score-btn.minus { color: #ff6b6b; }

    /* ========== 7. 历史记录区：左右两列展示每一局比分 ========== */
    .history {
      border: 1px solid var(--line-color);
      border-radius: var(--radius);
      padding: var(--gap);
    }
    .history-title {
      font-size: 14px;
      margin-bottom: 8px;
      opacity: 0.8;
      color: #1a01fc;
      font-weight: 800;
    }
    .history-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;  /* 左右两列 */
      gap: 6px var(--gap);
      font-size: 14px;
      line-height: 1.6;
    }
    .history-item { white-space: nowrap; }
    .history-empty { opacity: 0.5; }
  </style>
</head>
<body>

  <!-- ===== 1. 顶部：标题 + 「下一局」按钮（结束本局，开始下一局） ===== -->
  <header class="header">
    <div class="title">记分牌</div>
    <!-- 下一局键：点击后把当前比分记入历史，清空当前比分，局数 +1 -->
    <button class="ok-btn" id="okBtn">下一局</button>
  </header>

  <!-- ===== 2. 总比分：双方胜场数（格式 03:01） ===== -->
  <div class="total-score" id="totalScore">00:00</div>

  <!-- ===== 3. 名字输入：可直接输入，中间按钮互换双方名字 ===== -->
  <div class="name-row">
    <input class="name-input" id="nameLeft" type="text" placeholder="名字" maxlength="10">
    <button class="swap-btn" id="swapBtn" title="互换名字">⇄</button>
    <input class="name-input" id="nameRight" type="text" placeholder="名字" maxlength="10">
  </div>

  <!-- ===== 4. 当前局数（如：第七局） ===== -->
  <div class="round-label" id="roundLabel">第一局</div>

  <!-- ===== 5. 当前比分：左右两个大比分框 ===== -->
  <section class="current-score">
    <div class="score-box" id="scoreLeft">0</div>
    <div class="score-colon">:</div>
    <div class="score-box" id="scoreRight">0</div>
  </section>

  <!-- ===== 6. 加分系统：左侧 / 右侧各自的加减分按钮 ===== -->
  <section class="controls-row">
    <!-- 左方按钮组：data-score 为对应分值，需要改分值直接改这里 -->
    <div class="control-col">
      <div class="btn-grid">
        <button class="score-btn" data-side="left" data-score="1">+1</button>
        <button class="score-btn" data-side="left" data-score="2">+2</button>
        <button class="score-btn" data-side="left" data-score="3">+3</button>
        <button class="score-btn" data-side="left" data-score="4">+4</button>
        <button class="score-btn" data-side="left" data-score="5">+5</button>
        <button class="score-btn" data-side="left" data-score="6">+6</button>
        <button class="score-btn" data-side="left" data-score="7">+7</button>
        <button class="score-btn" data-side="left" data-score="8">+8</button>
        <button class="score-btn" data-side="left" data-score="9">+9</button>
        <!-- +X：自定义分值，点击后弹窗输入数字 -->
        <button class="score-btn" data-side="left" data-score="x">+x</button>
        <!-- -X：自定义减分，点击后弹窗输入要减的分值 -->
        <button class="score-btn minus" data-side="left" data-score="-x">-x</button>
      </div>
    </div>
    <!-- 右方按钮组 -->
    <div class="control-col">
      <div class="btn-grid">
        <button class="score-btn" data-side="right" data-score="1">+1</button>
        <button class="score-btn" data-side="right" data-score="2">+2</button>
        <button class="score-btn" data-side="right" data-score="3">+3</button>
        <button class="score-btn" data-side="right" data-score="4">+4</button>
        <button class="score-btn" data-side="right" data-score="5">+5</button>
        <button class="score-btn" data-side="right" data-score="6">+6</button>
        <button class="score-btn" data-side="right" data-score="7">+7</button>
        <button class="score-btn" data-side="right" data-score="8">+8</button>
        <button class="score-btn" data-side="right" data-score="9">+9</button>
        <button class="score-btn" data-side="right" data-score="x">+x</button>
        <button class="score-btn minus" data-side="right" data-score="-x">-x</button>
      </div>
    </div>
  </section>

  <!-- ===== 7. 历史记录：之前每一局的比分 ===== -->
  <section class="history">
    <div class="history-title">历史记录</div>
    <div class="history-grid" id="historyGrid"></div>
  </section>

  <script>
    /* ============================================================
       JS 初始状态：默认名字、分值规则都在这里改
       ============================================================ */
    const state = {
      // 双方：name 名字，score 当前局比分，total 胜场数（赢一局 +1）
      players: [
        { name: '玩家A', score: 0, total: 0 },
        { name: '玩家B', score: 0, total: 0 }
      ],
      round: 1,                 // 当前局数，从第 1 局开始
      history: []               // 历史记录：{ round, s1, s2 }
    };

    /* ---------- 局数中文数字（第一局 / 第七局…） ---------- */
    const CN_NUM = ['一','二','三','四','五','六','七','八','九','十',
                     '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];
    function roundText(n) {
      return CN_NUM[n - 1] || (n + ''); // 超过 20 局直接显示阿拉伯数字
    }

    /* ---------- DOM 元素缓存 ---------- */
    const el = {
      nameLeft:   document.getElementById('nameLeft'),
      nameRight:  document.getElementById('nameRight'),
      totalScore: document.getElementById('totalScore'),
      roundLabel: document.getElementById('roundLabel'),
      scoreLeft:  document.getElementById('scoreLeft'),
      scoreRight: document.getElementById('scoreRight'),
      historyGrid:document.getElementById('historyGrid'),
      okBtn:      document.getElementById('okBtn'),
      swapBtn:    document.getElementById('swapBtn')
    };

    /* ---------- 渲染：把 state 同步到页面 ---------- */
    function render() {
      const [p1, p2] = state.players;

      // 名字输入框（避免输入时光标被重置：仅在未聚焦时回填）
      if (document.activeElement !== el.nameLeft)  el.nameLeft.value  = p1.name;
      if (document.activeElement !== el.nameRight) el.nameRight.value = p2.name;

      // 当前比分
      el.scoreLeft.textContent  = p1.score;
      el.scoreRight.textContent = p2.score;

      // 总比分（胜场数）：两位补零，格式 03:01
      el.totalScore.textContent =
        String(p1.total).padStart(2, '0') + ':' + String(p2.total).padStart(2, '0');

      // 当前局数
      el.roundLabel.textContent = '第' + roundText(state.round) + '局';

      // 历史记录：左右两列依次排列
      el.historyGrid.innerHTML = '';
      if (state.history.length === 0) {
        el.historyGrid.innerHTML = '<div class="history-empty">暂无记录</div>';
        return;
      }
      state.history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.textContent = `第${roundText(item.round)}局: ${item.s1}:${item.s2}`;
        el.historyGrid.appendChild(div);
      });
    }

    /* ---------- 加分 / 减分 ---------- */
    function applyScore(side, raw) {
      const idx = side === 'left' ? 0 : 1;
      const p = state.players[idx];

      // +X：弹窗输入自定义加分
      if (raw === 'x') {
        const input = prompt('输入要加的分值：', '1');
        const val = parseInt(input, 10);
        if (isNaN(val)) return;          // 取消或非法输入则不处理
        p.score += val;
      // -X：弹窗输入自定义减分
      } else if (raw === '-x') {
        const input = prompt('输入要减的分值：', '1');
        const val = parseInt(input, 10);
        if (isNaN(val)) return;
        p.score -= val;
      } else {
        p.score += Number(raw);
      }

      // 分数不允许为负；如需允许负分，删掉下面两行即可
      if (p.score < 0) p.score = 0;

      render();
    }

    /* ---------- 按钮事件委托：所有加减分按钮 ---------- */
    document.querySelectorAll('.score-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        applyScore(btn.dataset.side, btn.dataset.score);
      });
    });

    /* ---------- 名字输入：实时同步到 state ---------- */
    el.nameLeft.addEventListener('input',  () => state.players[0].name = el.nameLeft.value);
    el.nameRight.addEventListener('input', () => state.players[1].name = el.nameRight.value);

    /* ---------- 中间按钮：互换双方名字 ---------- */
    el.swapBtn.addEventListener('click', () => {
      [state.players[0].name, state.players[1].name] =
        [state.players[1].name, state.players[0].name];
      render();
    });

    /* ---------- 「下一局」键：结束本局 ----------
       1. 当前比分写入历史记录
       2. 比较本局比分：分数多的一方胜场 +1；平局双方都不加
       3. 当前比分清零，局数 +1，开始下一局          */
    el.okBtn.addEventListener('click', () => {
      const [p1, p2] = state.players;
      state.history.push({ round: state.round, s1: p1.score, s2: p2.score });
      // 胜场判定：本局得分高者 total +1；若平局则不加分
      if (p1.score > p2.score) {
        p1.total += 1;
      } else if (p2.score > p1.score) {
        p2.total += 1;
      }
      p1.score = 0;
      p2.score = 0;
      state.round += 1;
      render();
    });

    /* ---------- 首次渲染 ---------- */
    render();
  </script>
</body>
</html>
